server.port=${BNOC_PORT:8081}
server.address=${BNOC_BIND:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${BNOC_COOKIE_SECURE:false}
spring.datasource.url=${BNOC_DB_URL:jdbc:mysql://127.0.0.1:3307/bnoc?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.username=${BNOC_DB_USER:bnoc}
spring.datasource.password=${BNOC_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=5
spring.servlet.multipart.max-file-size=10485760B
spring.servlet.multipart.max-request-size=11534336B
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
bnoc.integration-mode=${BNOC_INTEGRATION_MODE:competition}
bnoc.provider-url=${BNOC_PROVIDER_URL:http://127.0.0.1:8082}
bnoc.provider-secret=${BNOC_MOCK_SECRET:}
bnoc.public-url=${BNOC_PUBLIC_URL:http://127.0.0.1:8081}
bnoc.bootstrap-admin=${BNOC_BOOTSTRAP_ADMIN:access-admin}
bnoc.departments=${BNOC_DEPARTMENTS:}
bnoc.file-root=${BNOC_FILE_ROOT:runtime/data/attachments}
bnoc.frontend-root=${BNOC_FRONTEND_ROOT:frontend/dist}
bnoc.gps.poll-ms=${BNOC_GPS_POLL_MS:30000}
bnoc.cpcon.poll-ms=${BNOC_CPCON_POLL_MS:30000}
bnoc.gps.timeout-ms=${BNOC_GPS_TIMEOUT_MS:5000}
bnoc.cpcon.timeout-ms=${BNOC_CPCON_TIMEOUT_MS:5000}
bnoc.gps.valid-seconds=${BNOC_GPS_VALID_SECONDS:120}
bnoc.cpcon.valid-seconds=${BNOC_CPCON_VALID_SECONDS:120}
bnoc.cpcon.codes=${BNOC_CPCON_CODES:1,2,3,4,5}
